name: Auto Issue Resolver Bot

on:
  issue_comment:
    types: [created]

jobs:
  resolve-issue:
    if: contains(github.event.comment.body, '/run-bot')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}

      - name: Process Issue Task
        run: |
          echo "" >> README.md
          echo "## Deployment Guide (Railway & Render)" >> README.md
          echo "Updated automatically via Issue #${{ github.event.issue.number }}" >> README.md

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.PAT_TOKEN }}
          commit-message: "docs: add deployment guide (#${{ github.event.issue.number }})"
          branch: "bot/issue-${{ github.event.issue.number }}"
          delete-branch: true
          title: "docs: add Railway & Render deployment guide (#${{ github.event.issue.number }})"
          body: "Automated PR generated from Issue #${{ github.event.issue.number }}"
