name: Auto Issue Resolver Bot

on:
  issue_comment:
    types:
      - created

permissions:
  contents: write
  pull-requests: write
  issues: read

jobs:
  resolve-issue:
    if: |
      github.event.issue.state == 'open' &&
      contains(github.event.comment.body, '/run-bot')

    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Update README
        run: |
          {
            echo ""
            echo "## Deployment Guide (Railway & Render)"
            echo ""
            echo "- Generated from Issue #${{ github.event.issue.number }}"
            echo "- Issue: ${{ github.event.issue.title }}"
            echo "- Triggered by @${{ github.event.comment.user.login }}"
          } >> README.md

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.PAT_TOKEN }}
          branch: bot/issue-${{ github.event.issue.number }}
          delete-branch: true
          commit-message: |
            docs: update README for issue #${{ github.event.issue.number }}
          title: |
            docs: Resolve #${{ github.event.issue.number }}
          body: |
            ## Automated Pull Request

            This PR was automatically generated.

            **Issue:** #${{ github.event.issue.number }}
            **Title:** ${{ github.event.issue.title }}

            Triggered by:
            @${{ github.event.comment.user.login }}

            Closes #${{ github.event.issue.number }}
